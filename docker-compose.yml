version: '3.9'

services:
  ux-portfolio:
    # HIER GEÄNDERT: Wir laden jetzt von der GitHub Container Registry
    image: ghcr.io/weareuntitled/ux-portfolio:latest
    container_name: ux-portfolio
    env_file:
      - .env.production
    environment:
      DEBUG_LOG_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      # Port 5002 nach außen, 3000 intern im Container
      - "127.0.0.1:5002:3000"
    volumes:
      - app_data:/data
      - app_uploads:/uploads

networks:
  default:
    name: fixundfertig_internal_net
    external: true

volumes:
  app_data:
  app_uploads:
  postgres_data: