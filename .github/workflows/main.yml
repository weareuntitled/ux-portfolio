name: Deploy UX Portfolio to Hostinger

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          envs: GITHUB_REPOSITORY
          script: |
            set -Eeuo pipefail

            APP_DIR="$HOME/ux-portfolio"

            # Clone once if the folder/repo does not exist yet.
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Always deploy exactly origin/main.
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd

            # Rebuild/restart app.
            docker compose up -d --build --remove-orphans

            # Keep disk usage under control.
            docker image prune -f
